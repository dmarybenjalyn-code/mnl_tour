<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Manila Educational Tour</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600..800&family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F6F0E4; --card:#FFFDF8; --ink:#1A2238; --muted:#5B6275; --rule:#DDD2BA;
  --gold:#C58B1B; --gold-soft:#F3E3B8; --cream:#FBF1D6;
  --bus:#1F4E8C; --bus-ink:#FFFFFF; --warn:#7A4800; --good:#17663F; --bad:#A3202E;
  --head:"Fraunces",Georgia,"Times New Roman",serif;
  --body:"Figtree","Segoe UI",system-ui,Arial,sans-serif;
  --lift:0 1px 0 rgba(26,34,56,.05),0 10px 24px -14px rgba(26,34,56,.35);
  box-sizing:border-box;
}
*,*::before,*::after{box-sizing:inherit}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 17px/1.5 var(--body);
  padding-bottom:calc(98px + env(safe-area-inset-bottom,0px))}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

.top{background:var(--ink);color:var(--cream);border-bottom:5px solid var(--gold);
  padding:calc(20px + env(safe-area-inset-top,0px)) 20px 20px}
.top h1{margin:0;font:700 31px/1.1 var(--head);letter-spacing:-.01em}
.top p{margin:6px 0 0;font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--gold-soft)}
.whobar{background:var(--gold-soft);color:var(--ink);padding:8px 16px;font-size:15px;text-align:center}
.whobar:empty{display:none}
.who{margin:0 0 8px;font-size:15px}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}

.buses{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0 4px}
.busbtn{display:grid;grid-template-columns:42px 1fr;align-items:center;gap:10px;padding:10px 12px;text-align:left;
  border:2px solid var(--rule);background:var(--card);border-radius:16px;box-shadow:var(--lift);font:700 16px/1.2 var(--body)}
.busbtn small{display:block;margin-top:2px;font:500 12.5px/1.25 var(--body);opacity:.85}
.busbtn .badge{display:grid;place-items:center;width:42px;height:42px;border-radius:12px;background:var(--c);color:var(--ci);font:700 22px var(--head)}
.busbtn[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:var(--ci)}
.busbtn[aria-pressed="true"] .badge{background:var(--ci);color:var(--c)}

.days{display:flex;gap:8px;overflow-x:auto;padding:14px 0 6px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:8px 15px;border:1.5px solid var(--rule);background:var(--card);border-radius:10px;font:600 15px var(--body);white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--gold-soft)}

.dayhead{margin:20px 0 14px;font:700 25px/1.2 var(--head);letter-spacing:-.005em}
.tag{display:inline-block;margin-left:8px;padding:1px 8px;border-radius:6px;background:var(--gold-soft);color:var(--warn);font:600 13px var(--body);vertical-align:middle}

.line{list-style:none;margin:0;padding:0}
.stop{position:relative;display:grid;grid-template-columns:70px 22px 1fr;column-gap:12px;padding-bottom:24px}
.stop::before{content:"";position:absolute;left:93px;top:10px;bottom:-10px;width:0;border-left:3px dotted var(--bus)}
.stop:last-child::before{display:none}
.stop time{font:700 19px/1.1 var(--head);text-align:right;padding-top:1px}
.stop time small{display:block;font:600 12px var(--body);color:var(--muted);margin-top:1px}
.mark{position:relative;z-index:1;width:16px;height:16px;margin:4px 3px 0;border:4px solid var(--bus);border-radius:3px;
  background:var(--paper);transform:rotate(45deg)}
.meal .mark{width:10px;height:10px;margin:7px 6px 0;border:0;border-radius:50%;background:var(--gold);transform:none}
.stop h3{margin:0;font:700 18.5px/1.25 var(--head)}
.stop p{margin:3px 0 0;color:var(--muted);font-size:16px}

.card{background:var(--card);border:1px solid var(--rule);border-radius:20px;padding:18px;margin:16px 0;box-shadow:var(--lift)}
.card h2{margin:0 0 6px;font:700 22px var(--head)}
.muted{color:var(--muted)}
.err{color:var(--bad);font-weight:600}
label{display:block;font-weight:600;margin:10px 0 6px}
select,input{width:100%;padding:12px;border:1.5px solid var(--rule);border-radius:12px;background:#fff;font:inherit}
.primary{display:block;width:100%;margin-top:14px;padding:14px;border:0;border-radius:14px;background:var(--bus);color:var(--bus-ink);font:700 17px var(--body);
  box-shadow:0 3px 0 rgba(26,34,56,.25)}
.primary:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(26,34,56,.25)}
.link{border:0;background:none;padding:0;color:var(--ink);text-decoration:underline;text-decoration-color:var(--gold);text-underline-offset:3px;font-size:15px}
.photo{display:block;margin:6px 0 18px;padding:14px;border-radius:14px;border:2px solid var(--ink);text-align:center;font-weight:700;color:var(--ink);text-decoration:none;background:var(--card)}

.big{display:flex;justify-content:space-between;align-items:center;width:100%;min-height:76px;margin-top:12px;padding:14px 18px;
  border:2px solid var(--bus);border-radius:18px;background:var(--card);text-align:left;font:700 21px var(--head)}
.big small{display:block;font:400 15px var(--body);color:var(--muted);margin-top:2px}
.big.done{background:var(--bus);color:var(--bus-ink)}
.big.done small{color:inherit;opacity:.9}
.big .tick{font-size:28px}

.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:12px 0}
.seg button{padding:10px;border:1.5px solid var(--rule);border-radius:12px;background:var(--card);font-weight:600}
.seg button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--gold-soft)}
.sum{display:flex;justify-content:space-between;align-items:baseline;margin:10px 0}
.sum b{font:700 34px var(--head)}
.roster{list-style:none;margin:0;padding:0}
.roster button{display:flex;justify-content:space-between;width:100%;padding:13px 4px;border:0;border-bottom:1px solid var(--rule);background:none;text-align:left}
.roster .ok{color:var(--good);font-weight:700}
.roster .no{color:var(--muted)}

.info h3{margin:20px 0 4px;font:700 18px var(--head)}
.info ul{margin:4px 0;padding-left:20px}
.info li{margin:3px 0}

.nav{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(5,1fr);gap:2px;
  max-width:620px;margin:0 auto;padding:5px;background:var(--ink);border-radius:22px;box-shadow:0 10px 30px -8px rgba(26,34,56,.55)}
.nav button{padding:12px 2px;border:0;border-radius:17px;background:none;font:600 14px var(--body);color:#C9CCD8}
.nav button[aria-current="page"]{background:var(--gold-soft);color:var(--ink);font-weight:800}

.learn{margin:8px 8px 0 0;padding:8px 14px;border:2px solid var(--bus);border-radius:10px;background:var(--card);font:700 15px var(--body)}
.learn[aria-expanded="true"]{background:var(--bus);color:var(--bus-ink)}
.panel{margin-top:12px;padding:14px;background:var(--card);border:1px solid var(--rule);border-top:5px solid var(--bus);border-radius:14px;box-shadow:var(--lift)}
.panel h4{margin:14px 0 4px;font:700 16px var(--head)}
.panel h4:first-child{margin-top:0}
.panel ul{margin:4px 0 0;padding-left:20px}
.stop .panel p.q{margin:4px 0 8px;color:var(--ink);font-weight:600}
.stop .panel p.tip{margin:0 0 4px;font-size:15px}
.photobtn{display:inline-block;margin-top:10px;padding:9px 14px;border:2px solid var(--ink);border-radius:10px;font-weight:700;color:var(--ink);text-decoration:none}
textarea{width:100%;min-height:120px;padding:12px;border:1.5px solid var(--rule);border-radius:12px;background:#fff;font:inherit;resize:vertical}
.ghost{display:block;width:100%;margin-top:10px;padding:12px;border:2px solid var(--ink);border-radius:14px;background:none;font:700 16px var(--body)}
.ans{padding:12px 0;border-bottom:1px solid var(--rule)}
.ans h3{margin:0;font:700 17px var(--head)}
.ans h3 small{margin-left:6px;font:400 14px var(--body);color:var(--muted)}
.ans p{margin:4px 0 0;white-space:pre-wrap}
.miss{margin:14px 0}
.miss summary{cursor:pointer;font-weight:600}
.qbox{margin:10px 0 4px;font-weight:600}

.seg.five{grid-template-columns:repeat(3,1fr);gap:6px}
.seg.five button{padding:10px 2px;font-size:14px}
.cps{list-style:none;margin:0;padding:0}
.cp{border-bottom:1px solid var(--rule)}
.cphead{display:grid;grid-template-columns:78px 1fr;column-gap:10px;width:100%;padding:14px 4px;border:0;background:none;text-align:left}
.cptime{grid-row:span 2;font:700 17px/1.2 var(--head)}
.cptitle{font:700 17px/1.25 var(--head)}
.cphead .ok{color:var(--good);font-weight:700}
.cphead .no{color:var(--muted)}
.cp.done .cptitle::after{content:" \2713";color:var(--good)}
.cppanel{padding:2px 4px 18px}
.names{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:10px 0}
.nm{padding:10px 8px;border:1.5px solid var(--bus);border-radius:12px;background:var(--card);text-align:left;font-size:15px}
.nm.out{background:#FBE3E5;border-color:var(--bad);color:#7A1520;text-decoration:line-through}
.syncnote{margin:10px 0;padding:10px 12px;border-radius:12px;background:var(--gold-soft);color:var(--warn);font-weight:600}
.ovcard{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:14px;margin:10px 0;background:var(--card);border:1px solid var(--rule);border-left:6px solid var(--c);border-radius:14px;box-shadow:var(--lift)}
.ovbadge{display:grid;place-items:center;width:44px;height:44px;border-radius:12px;font:700 22px var(--head)}
.ovcount{font:700 30px var(--head);text-align:right}
.ovcount small{font:600 14px var(--body);color:var(--muted)}
.qcard{display:grid;grid-template-columns:84px 1fr;gap:14px;padding:16px;margin:12px 0;background:var(--card);border:1px solid var(--rule);border-radius:20px;box-shadow:var(--lift)}
.qcard h3{margin:0;font:700 19px var(--head)}
.qcard p{margin:4px 0}
.stamp{display:grid;place-items:center;width:84px;height:84px;border-radius:50%;border:3px dashed var(--rule);color:var(--muted);font:700 26px var(--head);text-align:center}
.stamp.on{border:5px double var(--gold);background:var(--gold-soft);color:var(--ink);transform:rotate(-8deg);font:800 12px var(--body);letter-spacing:.1em}
.okmsg{color:var(--good);font-weight:700}
.rule{margin:12px 0;padding:10px 12px;border-radius:12px;background:var(--gold-soft);color:var(--ink);font-size:15px}
.qchip{display:inline-block;margin:8px 8px 0 0;padding:6px 12px;border-radius:8px;background:#EBE3CF;font:600 14px var(--body)}
.qchip.got{background:var(--gold);color:var(--ink)}
.count{margin-left:8px;font:600 16px var(--body);color:var(--muted)}

.stars{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:8px 0 2px}
.star{min-height:48px;border:2px solid var(--ink);border-radius:12px;background:var(--card);font:700 20px var(--head)}
.star[aria-pressed="true"]{background:var(--ink);color:var(--gold-soft)}
.starlabels{display:flex;justify-content:space-between;margin-bottom:8px;font-size:14px;color:var(--muted)}
.evq{padding:16px 0;border-bottom:1px solid var(--rule)}
.evq h3{margin:0 0 4px;font:700 18px/1.25 var(--head)}
.evq p{margin:0 0 6px}
.evq .qn{color:var(--gold)}
.fbday{margin:20px 0 4px;font:700 19px var(--head)}
.fb{border-bottom:1px solid var(--rule);padding-bottom:10px}
.fbhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;width:100%;padding:12px 4px 8px;border:0;background:none;text-align:left}
.fbt{font:700 17px/1.25 var(--head)}
.fbt small{display:block;margin-top:2px;font:400 14px/1.35 var(--body);color:var(--muted)}
.fbavg{font:700 26px var(--head);white-space:nowrap}
.fbavg small{font:600 14px var(--body);color:var(--muted)}
.bar{height:8px;margin:0 4px;background:#E6DDC7;border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--bus)}
.buschips{display:flex;flex-wrap:wrap;gap:4px 16px;margin:8px 4px 0;font-size:15px}
.cmt{margin:8px 4px 0;padding:8px 10px;background:var(--card);border-left:4px solid var(--gold);border-radius:6px}
@media (prefers-reduced-motion:no-preference){.big,.busbtn,.chip,.nav button{transition:background-color .15s,color .15s}}
</style>
</head>
<body>
<header class="top"><div class="wrap" style="padding:0"><h1>Manila Educational Tour</h1><p id="range"></p></div></header>
<div class="whobar" id="whobar" role="status"></div>
<main class="wrap" id="app"></main>
<nav class="nav" aria-label="Sections">
  <button data-tab="itinerary">Itinerary</button>
  <button data-tab="quest">Quest</button>
  <button data-tab="eval">Evaluate</button>
  <button data-tab="info">Info</button>
  <button data-tab="teachers">Teachers</button>
</nav>

<script>
/* ============ SETTINGS (edit these) ============ */
const CONFIG = {
  // Paste your Google Apps Script web app link here (it ends in /exec).
  // Leave blank to run in demo mode (data is saved only on that one phone).
  sheetsUrl: "https://script.google.com/macros/s/AKfycbyKYOb1fNrqDTR1rhNNpFpe45cNi2T4ZZPRoKDTmFSvkN2-eoFYf7mbedSqLmGj4SId/exec",
  // Used in demo mode only. With Google Sheets, the real teacher PIN is set inside the script.
  teacherPin: "2026",
  // One link where students upload their quest photos and videos (a Padlet board, Google Drive folder or Google Form).
  // Leave blank to hide the button. A single quest can have its own link: add  upload:"https://..."  to it in QUESTS.
  questUpload: "",
  // Paste a Padlet (or other) link for each day. Blank = hidden.
  photoLinks: { 1:"", 2:"", 3:"" },
  // Teacher contacts. Add the mobile numbers, e.g. phone: "+63 900 000 0000". A blank phone shows the name only.
  contacts: [
    { name: "Sir Jansyl (Head FOC)", phone: "" },
    { name: "Ma'am Jessa Baylon (FOC, Group 1)", phone: "" },
    { name: "Nurse Julie (FOC, Group 2)", phone: "" }
  ],
  // Hotel name and address for the Info tab. Blank = a "to be posted" note.
  hotel: "",
  // Marks parts of the itinerary that still need confirming. Set to false before sharing with students.
  showDraftFlags: false
};

/* ============ GROUPS ============
   Group 1 = Charity and Integrity (FOC: Ma'am Jessa Baylon). Group 2 = Faith, Justice and Wisdom (FOC: Nurse Julie).
   Head FOC: Sir Jansyl. (The code calls a group a "bus" internally. Ignore that, it only matters to the Sheet column name.) */
const BUSES = [
  { n:1, color:"#1F4E8C", ink:"#FFFFFF", sub:"Charity and Integrity" },
  { n:2, color:"#B3402A", ink:"#FFFFFF", sub:"Faith, Justice and Wisdom" }
];

/* ============ ROSTER (numbers only, no names) ============
   Students are identified by group and assigned number, for example G2-07 is Group 2, number 7.
   Real names are NOT in this file, because this website is public. They live in the "roster" tab of your
   private Google Sheet, and teachers load them with the PIN.
   LAYOUT lists the room pairs of each group in order: [size, section]. size 2 = a pair, 3 = a trio, 1 = no partner.
   For a pair from two sections, write the section as an array, for example ["Integrity","Justice"]. */
const LAYOUT = {
  1: [[3,"Charity"],[2,"Charity"],[2,"Charity"],[2,"Charity"],
      [2,"Integrity"],[2,"Integrity"],[2,"Integrity"],[2,"Integrity"],[2,"Integrity"],
      [2,"Integrity"],[2,"Integrity"],[2,"Integrity"],[2,"Integrity"],[2,"Integrity"],
      [2,["Integrity","Justice"]]],
  2: [[2,"Faith"],[2,"Faith"],[2,"Faith"],[1,"Faith"],
      [2,"Justice"],[2,"Justice"],[2,"Justice"],[2,"Justice"],[2,"Justice"],
      [2,"Wisdom"],[2,"Wisdom"],[2,"Wisdom"],[2,"Wisdom"],[2,"Wisdom"]]
};
const ROSTER = [];
(function(){
  let pairNo = 0;
  Object.keys(LAYOUT).forEach(bus=>{
    let n = 0;
    LAYOUT[bus].forEach(([size,sec])=>{
      pairNo++;
      const pair = "P" + String(pairNo).padStart(2,"0");
      for(let j=0;j<size;j++){ n++;
        ROSTER.push({ id:"G"+bus+"-"+String(n).padStart(2,"0"), n, bus:+bus, pair, sec:Array.isArray(sec)?sec[j]:sec }); }
    });
  });
})();
const PAIRS = {};
ROSTER.forEach(r => { (PAIRS[r.pair] = PAIRS[r.pair] || { id:r.pair, bus:r.bus, members:[] }).members.push(r); });
const pairNum = id => parseInt(String(id).slice(1),10);
const listNames = a => a.length<2 ? a.join("") : a.slice(0,-1).join(", ") + " and " + a[a.length-1];

/* ============ GUIDE: quick facts, photos and a reflection question for each stop ============
   Taken from the Grade 10 Reflection Passport. A stop picks up its place automatically from its title
   using PLACE_RULES below. If you rename a stop, check the rule still matches. */
const GUIDE_TIP = "Answer in 2 to 4 sentences. Use specific details from what you actually see or experience. There is no single correct answer, so show your own thinking and do not copy the quick facts.";
const QUEST_RULE = "Respect museum, government and performance-venue rules. Do not take photos where photography is not allowed, and ask permission before photographing other people.";
const GUIDE = {
  "ccp": { name:"CCP Complex", photo:"Cultural Center of the Philippines Complex Manila",
    facts:["The Cultural Center of the Philippines (CCP) is one of the country's major centers for performing arts.",
           "It was established in 1969.",
           "It has helped promote Filipino music, theater, dance and other forms of culture."],
    question:"If the CCP Complex could tell one story about Filipino identity, what story do you think it would tell? What details around you support your answer?" },
  "luneta": { name:"Luneta Park", photo:"Rizal Park Luneta Manila",
    facts:["Rizal Park, commonly called Luneta, is one of the Philippines' most important historical landmarks.",
           "José Rizal was executed here on December 30, 1896."],
    question:"If José Rizal could walk around Luneta today, what change in the Philippines do you think would make him proud, and what might make him concerned? Why?" },
  "fort-santiago": { name:"Fort Santiago", photo:"Fort Santiago Intramuros Manila",
    facts:["Fort Santiago is a historic fortress inside Intramuros.",
           "It served as an important military and political site during the Spanish colonial period.",
           "José Rizal was imprisoned here before his execution."],
    question:"If you could ask ONE person from Fort Santiago's past a single question, who would you ask and what would you ask?" },
  "manila-cathedral": { name:"Manila Cathedral", photo:"Manila Cathedral Intramuros",
    facts:["The Manila Cathedral is the cathedral of the Archdiocese of Manila.",
           "The present structure is the eighth major version of the cathedral. Earlier structures were destroyed or damaged by disasters and war."],
    question:"What does repeatedly rebuilding a historic place like Manila Cathedral tell us about the people and community connected to it?" },
  "bahay-tsinoy": { name:"Bahay Tsinoy", photo:"Bahay Tsinoy Museum Intramuros",
    facts:["Bahay Tsinoy is a museum in Intramuros.",
           "It tells the story of the Chinese-Filipino community and its contributions to Philippine history and society.",
           "Chinese-Filipino interactions in the Philippines go back centuries."],
    question:"After learning about the Chinese-Filipino experience, how might your idea of \"Filipino identity\" become more complete or more complicated?" },
  "intramuros": { name:"Centro de Turismo Intramuros", photo:"Intramuros Manila walled city",
    facts:["Intramuros means \"within the walls\".",
           "It was the walled city established by the Spanish.",
           "It became an important center of colonial government, religion and trade."],
    question:"If Intramuros were redesigned for teenagers today without losing its historical identity, what would you add, and what would you make sure never changes?" },
  "nm-fine-arts": { name:"National Museum of Fine Arts", photo:"National Museum of Fine Arts Spoliarium Manila",
    facts:["The National Museum of Fine Arts houses important Philippine artworks, including Juan Luna's famous Spoliarium.",
           "Art can communicate ideas about history, society, identity and human experiences."],
    question:"Choose one artwork that catches your attention. SEE: What do you notice? THINK: What do you think the artist is communicating? WONDER: What question do you still have?" },
  "nm-natural-history": { name:"National Museum of Natural History", photo:"National Museum of Natural History Manila",
    facts:["The National Museum of Natural History showcases Philippine biodiversity, geological features, plants and animals.",
           "The Philippines is considered a biodiversity hotspot, with many species found nowhere else in the world."],
    question:"Choose one specimen or exhibit. What does it reveal about the Philippines that you might not notice in your everyday life?" },
  "senate": { name:"Philippine Senate", photo:"Philippine Senate building Pasay",
    facts:["The Senate is one of the two chambers of the Congress of the Philippines.",
           "The country has 24 senators who are elected nationwide."],
    question:"If you could propose ONE law that would improve the lives of Filipino teenagers, what would it be? What problem would your law solve?" },
  "doe": { name:"Department of Energy", photo:"Department of Energy Philippines Taguig",
    facts:["The Department of Energy develops policies and programs related to the country's energy resources.",
           "Energy decisions affect electricity, transportation, fuel and renewable energy."],
    question:"Think about your day so far. What activity probably used the most energy, and what realistic change could you make to reduce your energy use?" },
  "admu": { name:"Ateneo de Manila University", photo:"Ateneo de Manila University campus",
    facts:["Ateneo de Manila University is a private Jesuit university in Quezon City.",
           "Its institutional history dates back to 1859."],
    question:"Imagine yourself as a college student five years from now. Based on what you saw today, what kind of learner do you want to become, and what habit should you start developing now?" },
  "observatory": { name:"ADMU Observatory", photo:"Manila Observatory Ateneo Quezon City",
    facts:["The Manila Observatory was established in 1865.",
           "It has a long history of scientific research in areas such as weather, climate, atmospheric science and geophysics."],
    question:"If you had unlimited technology and could investigate ONE mystery about space or Earth, what would you investigate, and why?" },
  "car-museum": { name:"Presidential Car Museum", photo:"Presidential Car Museum Philippines",
    facts:["The Presidential Car Museum features vehicles associated with Philippine presidents and important moments in Philippine history."],
    question:"These cars were once ordinary objects, but they became historical artifacts. What does this teach us about how ordinary objects can become important pieces of history?" },
  "ppo": { name:"Philippine Philharmonic Orchestra", photo:"Philippine Philharmonic Orchestra concert",
    facts:["The Philippine Philharmonic Orchestra is one of the country's leading professional orchestras.",

// Talks to the Google Sheet through your Apps Script link. Retries a few times if Google is busy.
async function api(action, payload = {}){
  const tries = 3;
  for(let i=0;i<tries;i++){
    try{
      const r = await fetch(CONFIG.sheetsUrl, {
        method:"POST", headers:{ "Content-Type":"text/plain;charset=utf-8" },
        body:JSON.stringify({ action, pin:state.pin||"", ...payload })
      });
      const j = await r.json();
      if(j.ok) return j.data;
      if(j.error==="busy"){ await sleep(500*(i+1)); continue; }
      const err = new Error(j.error||"error"); err.fatal = true; throw err;
    }catch(e){
      if(e.fatal || i===tries-1) throw e;
      await sleep(600*(i+1));
    }
  }
  throw new Error("busy");
}

async function teacherWrite(action, payload, dk){
  if(!remote){ LOCAL_WRITE[action](payload); return 0; }
  const q = qStore.get().filter(x=>x.dk!==dk);          // a newer save for the same thing replaces the older one
  q.push({ id:Date.now()+"-"+Math.random().toString(36).slice(2,7), dk, action, payload });
  qStore.set(q);
  return flushQueue();
}
let flushing = false;
async function flushQueue(){
  if(!remote || flushing || !state.pin) return 0;
  flushing = true; let sent = 0;
  try{
    for(;;){
      const q = qStore.get(); if(!q.length) break;
      const it = q[0];
      try{ await api(it.action, it.payload); }
      catch(e){
        if(!e.fatal) break;                                  // no signal, or Google is busy: keep it and try later
        qStore.set(qStore.get().filter(x=>x.id!==it.id));   // the server refused it: drop it so it cannot block the rest
        alert("A record could not be saved (" + e.message + "). Please tell the person who runs the site.");
        continue;
      }
      qStore.set(qStore.get().filter(x=>x.id!==it.id)); sent++;
    }
  } finally { flushing = false; }
  return sent;
}

function splitTime(t){
  const parts = String(t).split(/\s*[-–]\s*/);
  const parse = z => {
    const m = (z||"").trim().match(/^(\d{1,2})(?::(\d{2}))?\s*(AM|PM)?$/i);
    return m ? { h:+m[1], mi:m[2]||"00", ap:(m[3]||"").toUpperCase() } : null;
  };
  const a = parse(parts[0]), b = parts[1] ? parse(parts[1]) : null;
  if(!a) return { start:String(t), mer:"", end:"" };
  let ap = a.ap;
  if(!ap && b && b.ap){
    ap = b.ap;
    if((a.h%12) > (b.h%12)) ap = (ap==="PM") ? "AM" : "PM";
  }
  const end = b ? `${b.h}:${b.mi} ${b.ap||ap}`.trim() : "";
  return { start:`${a.h}:${a.mi}`, mer:ap, end };
}

function cpRecord(key){
  const it = qStore.get().find(x=>x.action==="saveCheckpoint" && x.payload.key===key);
  if(it){ const p = it.payload;
    return { present:p.total-p.missing.length, total:p.total, missing_ids:p.missing, checked_at:p.at, pending:true }; }
  return state.cpRows.find(r=>r.key===key) || null;
}

const avg = a => a.length ? a.reduce((x,y)=>x+y,0)/a.length : 0;
const f1 = n => (Math.round(n*10)/10).toFixed(1);
const commentsHTML = rs => {
  const w = rs.filter(r=>r.comment);
  return w.length ? w.map(r=>`<p class="cmt"><b>${r.rating} of 5</b>, Group ${r.bus}: ${esc(r.comment)}</p>`).join("")
                  : `<p class="muted" style="margin:8px 4px 0">No comments on this stop.</p>`;
};

function paintFeedback(){
  const box = $("#fbbody"); if(!box) return;
  const bf = state.tbusF;
  if(state.fbmode==="stops"){
    const rows = state.fbRows.filter(r=>!bf || r.bus===bf);
    const by = {}; rows.forEach(r=>{ (by[r.stop_key] = by[r.stop_key] || []).push(r); });
    let html = "";
    DAYS.forEach(d=>{
      const seen = new Set(), items = [];
      d.stops.forEach(x=>{ if(!x.rate) return; const k = stopKey(d.n,x); if(seen.has(k)) return; seen.add(k); items.push({ k, title:titleFor(x) }); });
      if(!items.length) return;
      html += `<h3 class="fbday">Day ${d.n}, ${fmtDate(d.date,{weekday:"long",month:"short",day:"numeric"})}</h3>`;
      items.forEach(it=>{
        const rs = by[it.k] || [], a = avg(rs.map(r=>r.rating)), open = state.fbOpen===it.k;
        html += `<article class="fb"><button class="fbhead" data-act="fbopen" data-k="${it.k}" aria-expanded="${open}">
          <span class="fbt">${esc(it.title)}<small>${rs.length ? rs.length+" rating"+(rs.length>1?"s":"") : "No ratings yet"}</small></span>
          ${rs.length ? `<span class="fbavg">${f1(a)}<small> of 5</small></span>` : ""}</button>
          ${rs.length ? `<div class="bar"><i style="width:${a/5*100}%"></i></div>` : ""}${open ? commentsHTML(rs) : ""}</article>`;
      });
    });
    box.innerHTML = html || `<p class="muted">No stops to rate.</p>`;
    return;
  }
  const rows = state.evRows.filter(r=>!bf || r.bus===bf);
  const total = ROSTER.filter(r=>!bf || r.bus===bf).length;
  let html = `<div class="sum"><div><b>${rows.length}</b> of ${total} submitted</div></div>`;
  EVAL.forEach((q,i)=>{
    if(q.type==="rate"){
      const vals = rows.map(r=>r[q.id+"_r"]).filter(Boolean), cm = rows.filter(r=>r[q.id+"_c"]);
      const per = bf ? "" : `<div class="buschips">${BUSES.map(b=>{
        const v = rows.filter(r=>r.bus===b.n).map(r=>r[q.id+"_r"]).filter(Boolean);
        return `<span>Group ${b.n}: <b>${v.length ? f1(avg(v)) : "-"}</b></span>`; }).join("")}</div>`;
      html += `<article class="fb"><div class="fbhead"><span class="fbt">${i+1}. ${esc(q.title)}<small>${vals.length} rating${vals.length===1?"":"s"}</small></span>
        ${vals.length ? `<span class="fbavg">${f1(avg(vals))}<small> of 5</small></span>` : ""}</div>
        ${vals.length ? `<div class="bar"><i style="width:${avg(vals)/5*100}%"></i></div>` : ""}${per}
        ${cm.length ? `<details class="miss"><summary>Comments (${cm.length})</summary>${cm.map(r=>`<p class="cmt"><b>${r[q.id+"_r"] ? r[q.id+"_r"]+" of 5" : "No rating"}</b>, Group ${r.bus}: ${esc(r[q.id+"_c"])}</p>`).join("")}</details>` : ""}</article>`;
    } else {
      const ans = rows.filter(r=>r[q.id]);
      html += `<article class="fb"><div class="fbhead"><span class="fbt">${i+1}. ${esc(q.title)}<small>${esc(q.text)}</small></span></div>
        <details class="miss"><summary>Answers (${ans.length})</summary>${ans.length ? ans.map(r=>`<p class="cmt"><b>Group ${r.bus}</b>: ${esc(r[q.id])}</p>`).join("") : `<p class="muted">No answers yet.</p>`}</details></article>`;
    }
  });
  box.innerHTML = html;
}

function paintQuest(){
  const box = $("#qlist"); if(!box) return;
  const qid = state.tquest;
  const stamped = new Set(state.qrows.filter(r=>r.quest===qid).map(r=>r.pair));
  qStore.get().forEach(it => {                      // show stamps still waiting to sync
    if(it.payload.quest!==qid) return;
    if(it.action==="awardStamp") stamped.add(it.payload.pair);
    if(it.action==="revokeStamp") stamped.delete(it.payload.pair);
  });
  const pairs = Object.values(PAIRS).filter(p=>!state.tbusF || p.bus===state.tbusF);
  $("#qsum").innerHTML = `<b>${pairs.filter(p=>stamped.has(p.id)).length}</b> of ${pairs.length} pairs stamped`;
  box.innerHTML = pairs.map(p=>{
    const on = stamped.has(p.id);
    return `<li><button data-act="stamp" data-pair="${p.id}" data-on="${on?1:0}"><span>Pair ${pairNum(p.id)}, Group ${p.bus}<br><small class="muted">${esc(listNames(p.members.map(tag)))}</small></span>
      <span class="${on?"ok":"no"}">${on?"Stamped. Tap to undo":"Award stamp"}</span></button></li>`;
  }).join("");
}

function saveCSVFile(name, lines){
  const blob = new Blob(["﻿" + lines.join("\r\n")], { type:"text/csv;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = name + ".csv";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}
// Feedback files never contain student names, numbers or IDs.
async function downloadFeedbackCSV(){
  const lines = [];
  if(state.fbmode==="stops"){
    const rows = await db.allRatings();
    lines.push(["group","day","stop","rating","comment","saved_at"].map(csvCell).join(","));
    rows.forEach(r=>lines.push([r.bus,r.day,r.stop_title,r.rating,r.comment,r.updated_at].map(csvCell).join(",")));
    return saveCSVFile("manila-stop-ratings", lines);
  }
  const rows = await db.allEvals();
  const head = ["group"];
  EVAL.forEach(q=>{ if(q.type==="rate") head.push(q.title+" (rating)", q.title+" (comment)"); else head.push(q.title); });
  head.push("saved_at");
  lines.push(head.map(csvCell).join(","));
  rows.forEach(r=>{
    const row = [r.bus];
    EVAL.forEach(q=>{ if(q.type==="rate") row.push(r[q.id+"_r"]||"", r[q.id+"_c"]||""); else row.push(r[q.id]||""); });
    row.push(r.updated_at);
    lines.push(row.map(csvCell).join(","));
  });
  saveCSVFile("manila-final-evaluations", lines);
}

function refreshTeacher(){
  if(state.tab!=="teachers" || !state.unlocked) return;
  ({ checkin:hydrateCp, overview:hydrateOverview, answers:hydrateAnswers, quest:hydrateQuestAdmin, feedback:hydrateFeedback })[state.tmode]();
}

function csvCell(v){
  let s = String(v==null?"":v);
  if(/^[=+\-@\t\r]/.test(s)) s = "'" + s;   // stops spreadsheets from running answers as formulas
  return '"' + s.replace(/"/g,'""') + '"';
}

async function downloadCSV(place){
  const rows = await db.allAnswers(place);
  const byId = new Map(ROSTER.map(r=>[r.id,r]));
  const head = ["student_id","student_name","group","number","pair","day","place","question","answer","saved_at"];
  const lines = [head.map(csvCell).join(",")];
  rows.forEach(r => {
    const g = GUIDE[r.place] || { name:r.place, question:"" }, st = byId.get(r.student_id) || {};
    lines.push([r.student_id, NAMES[r.student_id]||"", r.bus, st.n||"", st.pair||"", r.day, g.name, g.question, r.answer, r.updated_at].map(csvCell).join(","));
  });
  const blob = new Blob(["\uFEFF" + lines.join("\r\n")], { type:"text/csv;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "manila-answers" + (place?"-"+place:"") + ".csv";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}

/* ============ RENDER + EVENTS ============ */
const meLabel = () => state.me ? `Group ${state.me.bus}, No. ${state.me.n}` : "";
const meTag = () => state.me ? `<p class="who">Answering as <b>${meLabel()}</b>. Wrong number? <button class="link" data-act="switchme">Not you?</button></p>` : "";
function updateWho(){
  const el = $("#whobar"); if(!el) return;
  el.innerHTML = (state.me && state.tab!=="teachers") ? `Signed in as <b>${meLabel()}</b>. <button class="link" data-act="switchme">Not you?</button>` : "";
}
function render(){
  clearInterval(poll);
  const b = BUSES[state.bus-1];
  document.documentElement.style.setProperty("--bus", b.color);
  document.documentElement.style.setProperty("--bus-ink", b.ink);
  const views = { itinerary:viewItinerary, quest:viewQuest, eval:viewEval, info:viewInfo, teachers:viewTeachers };
  $("#app").innerHTML = views[state.tab]();
  updateWho();
  document.querySelectorAll(".nav button").forEach(n=>n.setAttribute("aria-current", n.dataset.tab===state.tab?"page":"false"));
  if(state.tab==="quest") loadStamps();
  if(state.tab==="teachers" && state.unlocked){
    refreshTeacher();
    if(state.tmode==="checkin" || state.tmode==="overview") poll = setInterval(refreshTeacher, 20000);
  }
}

document.addEventListener("click", async e=>{
  const el = e.target.closest("[data-act],[data-tab]"); if(!el) return;
  if(el.dataset.tab){ state.tab = el.dataset.tab; render(); window.scrollTo(0,0); return; }
  const a = el.dataset.act;
  if(a==="bus"){ state.bus=+el.dataset.bus; store.set("mnl_bus",state.bus); render(); }
  else if(a==="tbus"){ state.tbus=+el.dataset.bus; state.cp=null; render(); }
  else if(a==="day"){ state.day=+el.dataset.day; state.cp=null; render(); }
  else if(a==="pickme"){
    const id = $("#who").value, me = ROSTER.find(r=>r.id===id);
    if(!me){ $("#whoerr").textContent = "Choose your number from the list."; return; }
    state.me = me; state.bus = me.bus; state.mine = {}; state.stamps = {};
    store.set("mnl_me",me); store.set("mnl_bus",me.bus); loadFeedback(); render(); loadMine();
  }
  else if(a==="switchme"){ state.me=null; state.mine={}; state.stamps={}; store.set("mnl_me",null); loadFeedback(); render(); }
  else if(a==="unlock"){
    const v = $("#pin").value, nm = ($("#tname").value||"").trim();
    try{
      if(remote){ state.pin = v; await api("verifyPin"); }
      else if(v !== CONFIG.teacherPin) throw new Error("bad pin");
      state.tname = nm; store.set("mnl_tname",nm);
      state.unlocked = true; render();
      flushQueue().then(()=>updateSync());
      loadNames();
    }catch(err){
      state.pin = "";
      $("#pinerr").textContent = (err.fatal || err.message==="bad pin")
        ? "That PIN is not correct." : "Could not reach the server. Check the connection and try again.";
    }
  }
  else if(a==="openrate"){
    const k = el.dataset.k;
    state.rating = (state.rating===k) ? null : k;
    delete state.rdraft[k];
    render();
  }
  else if(a==="star"){
    const name = el.dataset.name, kind = name.slice(0,1), id = name.slice(2), v = +el.dataset.v;
    if(kind==="r") rdraft(id).rating = v;
    else { state.ev[id+"_r"] = v; persistEv(); }
    document.querySelectorAll(`[data-stars="${name}"] .star`).forEach(b=>b.setAttribute("aria-pressed", String(+b.dataset.v===v)));
  }
  else if(a==="saverate"){
    if(!state.me) return;
    const key = el.dataset.k, d = rdraft(key), st = $("#rate-status");
    if(!d.rating){ st.textContent = "Tap a number from 1 to 5 first."; return; }
    st.textContent = "Saving...";
    const comment = d.comment.trim();
    try{
      await db.setRating({ student_id:state.me.id, bus:state.me.bus, day:+el.dataset.day, stop_key:key, stop_title:el.dataset.t, rating:d.rating, comment });
      state.ratings[key] = { rating:d.rating, comment };
      store.set(mineKey("ratings",state.me.id), state.ratings);
      st.textContent = "Saved for " + meLabel() + " at " + fmtTime(new Date().toISOString()) + ". Thank you!";
      const btn = document.querySelector(`.learn[data-k="${key}"]`);
      if(btn) btn.textContent = `Rated ${d.rating} of 5. Edit`;
    }catch(err){
      st.textContent = "Could not save. Check your connection and try again.";
    }
  }
  else if(a==="evsave"){
    if(!state.me) return;
    const st = $("#ev-status"), e = state.ev, p = { student_id:state.me.id, bus:state.me.bus };
    EVAL.forEach(q=>{
      if(q.type==="rate"){ p[q.id+"_r"] = +e[q.id+"_r"] || 0; p[q.id+"_c"] = String(e[q.id+"_c"]||"").trim(); }
      else p[q.id] = String(e[q.id]||"").trim();
    });
    const blank = EVAL.filter(q => q.type==="rate" ? !p[q.id+"_r"] : !p[q.id]).length;
    if(blank===EVAL.length && !EVAL.some(q=>q.type==="rate" && p[q.id+"_c"])){ st.textContent = "Answer at least one question first."; return; }
    st.textContent = "Saving...";
    try{
      await db.setEval(p);
      state.evSavedAt = new Date().toISOString(); persistEv();
      st.textContent = "Saved for " + meLabel() + " at " + fmtTime(state.evSavedAt) + ". " + (blank ? blank+" question"+(blank>1?"s":"")+" still blank. You can come back to finish." : "All questions answered. Thank you!");
    }catch(err){
      st.textContent = "Could not save. Your answers are kept on this phone. Try again when you have signal.";
    }
  }
  else if(a==="fbmode"){ state.fbmode = el.dataset.mode; state.fbOpen = null; render(); }
  else if(a==="fbopen"){ state.fbOpen = (state.fbOpen===el.dataset.k) ? null : el.dataset.k; paintFeedback(); }
  else if(a==="fbrefresh"){ hydrateFeedback(); }
  else if(a==="fbcsv"){
    try{ await downloadFeedbackCSV(); }
    catch(err){ alert("Could not create the file. Check the connection and try again."); }
  }
  else if(a==="lock"){
    state.unlocked = false; state.pin = ""; state.cp = null; NAMES = {}; store.set("mnl_names", {}); render();
  }
  else if(a==="openplace"){ state.open = (state.open===el.dataset.p) ? null : el.dataset.p; render(); }
  else if(a==="saveans"){
    const key = el.dataset.p, ta = $("#ans-"+key), st = $("#ans-status");
    const text = ta.value.trim();
    if(!state.me) return;
    if(!text){ st.textContent = "Write an answer first."; return; }
    st.textContent = "Saving...";
    const day = (PLACE_LIST.find(x=>x.key===key)||{}).day || state.day;
    try{
      await db.setAnswer({ student_id:state.me.id, bus:state.me.bus, day, place:key, answer:text });
      state.mine[key] = text;
      try{ localStorage.removeItem("mnl_draft_"+key); }catch(e){}
      st.textContent = "Saved for " + meLabel() + " at " + fmtTime(new Date().toISOString()) + ".";
      const btn = document.querySelector(`.learn[data-p="${key}"]`);
      if(btn) btn.textContent = "Answered. View or edit";
    }catch(err){
      st.textContent = "Could not save. Your answer is kept on this phone. Try again when you have signal.";
    }
  }
  else if(a==="tmode"){ state.tmode = el.dataset.mode; state.cp = null; render(); }
  else if(a==="csv"){
    try{ await downloadCSV(el.dataset.scope==="one" ? state.tq : null); }
    catch(err){ alert("Could not create the file. Check the connection and try again."); }
  }
  else if(a==="cpopen"){
    const key = el.dataset.k;
    if(state.cp && state.cp.key===key) state.cp = null;
    else { const rec = cpRecord(key); state.cp = { key, missing:new Set(rec ? rec.missing_ids : []) }; }
    paintCp();
  }
  else if(a==="cpname"){
    const m = state.cp.missing, id = el.dataset.id;
    if(m.has(id)) m.delete(id); else m.add(id);
    paintCp();
  }
  else if(a==="cpsave"){
    const key = el.dataset.k;
    const stop = cpStops(state.day, state.tbus).find(x=>rowKey(state.day,x.title,state.tbus)===key);
    const roster = rosterOf(state.tbus), miss = state.cp.missing;
    if(!stop) return;
    el.disabled = true; el.textContent = "Saving...";
    const payload = { key, day:state.day, bus:state.tbus, time:stop.t, title:stop.title, total:roster.length,
      missing:[...miss], missing_names:roster.filter(r=>miss.has(r.id)).map(tag).join(", "),
      at:new Date().toISOString(), by:state.tname };
    const job = teacherWrite("saveCheckpoint", payload, "cp:"+key);
    state.cp = null; paintCp(); updateSync();          // show it straight away; it syncs in the background
    await job; updateSync();
    if(remote) hydrateCp();
  }
  else if(a==="stamp"){
    const on = el.dataset.on==="1", pair = el.dataset.pair;
    const job = teacherWrite(on?"revokeStamp":"awardStamp", { pair, quest:state.tquest, by:state.tname }, "stamp:"+pair+"|"+state.tquest);
    paintQuest(); updateSync();
    await job; updateSync();
    if(remote) hydrateQuestAdmin(); else { state.qrows = await db.allStamps(state.tquest); paintQuest(); }
  }
});

document.addEventListener("change", e=>{
  const el = e.target.closest("[data-change]"); if(!el) return;
  if(el.dataset.change==="tq"){ state.tq = el.value; render(); }
  else if(el.dataset.change==="tquest"){ state.tquest = el.value; render(); }
  else if(el.dataset.change==="tbusf"){ state.tbusF = +el.value; render(); }
});
document.addEventListener("input", e=>{
  const el = e.target;
  if(el.matches && el.matches("textarea[data-draft]")){
    try{ localStorage.setItem("mnl_draft_"+el.dataset.draft, el.value); }catch(err){}
  }
  else if(el.matches && el.matches("textarea[data-rc]")){ rdraft(el.dataset.rc).comment = el.value; }
  else if(el.matches && el.matches("textarea[data-ev]")){ state.ev[el.dataset.ev] = el.value; persistEv(); }
});

(function(){
  const a = fmtDate(DAYS[0].date,{month:"short",day:"numeric"});
  const z = fmtDate(DAYS[DAYS.length-1].date,{month:"short",day:"numeric",year:"numeric"});
  $("#range").textContent = a + " to " + z;
  if(state.me){ const fresh = ROSTER.find(r=>r.id===state.me.id); state.me = fresh || null; if(fresh) store.set("mnl_me",fresh); }
  loadFeedback(); render(); loadMine(); loadStamps();
  const tick = () => flushQueue().then(n=>{ updateSync(); if(n) refreshTeacher(); });
  setInterval(tick, 15000);
  if(window.addEventListener) window.addEventListener("online", tick);
})();
